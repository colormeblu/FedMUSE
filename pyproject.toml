[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fedmuse"
version = "0.1.0"
description = "Runnable research scaffold for Fed-MUSE (SGDH + HD-SPT + UA-TTAF)"
requires-python = ">=3.9,<3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
